[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentflare"]

[project]
name = "agentflare"
version = "0.2.0"
description = "Real-time cost observability and guardrails for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "llm", "observability", "cost", "guardrails", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]

[project.urls]
Homepage = "https://agent-flare.vercel.app"
Repository = "https://github.com/rambabu-143/agentflare-sdk"
"Bug Tracker" = "https://github.com/rambabu-143/agentflare-sdk/issues"
